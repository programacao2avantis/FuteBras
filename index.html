<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuteBras - Login</title>
    <!-- comum.css primeiro (base), depois o CSS só desta página -->
    <link rel="stylesheet" href="comum.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<!-- PROTÓTIPO NÃO FUNCIONAL: dados fictícios escritos direto no HTML. Só os links de navegação funcionam. -->

<!-- ===================== CABEÇALHO ===================== -->
<header>
    <div>
        <h1>⚽ FuteBras</h1>
        <p>Técnico e dirigente</p>
    </div>
</header>

<main>
    <div class="login">
        <div class="login-lado">
            <h2>FuteBras ⚽</h2>
            <p>Prepare-se para uma partida empolgante</p>
        </div>
        <div class="login-form">
            <h2>Bem-vindo</h2>
            <p class="sutil">Entre com sua conta para começar uma partida</p>

            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="seuemail@exemplo.com" value="tecnico@futebras.com">

            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="••••••••" value="1234">

            <!-- protótipo: "Entrar" é só um link para o painel -->
            <a class="botao-amarelo" href="painel.html">Entrar</a>
            <p class="sutil">Teste: tecnico@futebras.com / 1234</p>
        </div>
    </div>
</main>

</body>
</html>
